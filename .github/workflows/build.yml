name: Build Meer Radio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries (curl, mbedtls, zlib, mpg123)
        run: dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib 3ds-mpg123

      - name: Install makerom and bannertool
        run: |
          apt-get update && apt-get install -y --no-install-recommends wget unzip ca-certificates
          mkdir -p /tmp/tools && cd /tmp/tools
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O makerom.zip
          unzip -o -q makerom.zip -d makerom
          install -m755 "$(find makerom -type f -name makerom | head -n1)" /usr/local/bin/makerom
          wget -q https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip -O bannertool.zip
          unzip -o -q bannertool.zip -d bannertool
          install -m755 "$(find bannertool -type f -path '*linux-x86_64*' -name bannertool | head -n1)" /usr/local/bin/bannertool

      - name: Build .3dsx and .cia
        run: make cia

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MeerRadio
          path: |
            MeerRadio.cia
            MeerRadio.3dsx

      # Keeps https://github.com/meerok/MeerRadio3ds/releases/latest/download/MeerRadio.cia
      # (the link in the QR code) pointing at the newest build.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Meer Radio v1.0.0
          make_latest: true
          overwrite_files: true
          body: |
            AM/FM internet radio for the Nintendo 3DS.
            Install `MeerRadio.cia` with FBI, or scan the QR code in the README with FBI > Remote Install > Scan QR Code.
          files: |
            MeerRadio.cia
            MeerRadio.3dsx
